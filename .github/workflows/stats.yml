name: Update GitHub Stats

on:
workflow_dispatch:
schedule:
- cron: "0 0 * * *"

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v6

  - name: Generate Stats
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: stats
      options: 'username=Vnnz999&show_icons=true&include_all_commits=true&hide_border=true&bg_color=0D1117&title_color=00F7FF&icon_color=8A2BE2&text_color=C9D1D9&rank_icon=github'
      path: profile/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Generate Top Languages
    uses: stats-organization/github-readme-stats-action@v2
    with:
      card: top-langs
      options: 'username=Vnnz999&layout=compact&langs_count=8&hide_border=true&bg_color=0D1117&title_color=00F7FF&text_color=C9D1D9'
      path: profile/top-langs.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Commit Stats
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add profile/stats.svg profile/top-langs.svg

      git commit -m "Update GitHub stats" || exit 0

      git push
```
